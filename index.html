<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Three Body Problem</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #000;
    color: #fff;
    font-family: 'Share Tech Mono', monospace;
    overflow: hidden;
    height: 100vh;
    width: 100vw;
  }

  #canvas-container { position: fixed; inset: 0; }

  #title {
    position: fixed;
    top: 28px;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'Orbitron', sans-serif;
    font-size: 1.1rem;
    font-weight: 900;
    letter-spacing: 0.25em;
    color: #fff;
    text-shadow: 0 0 20px rgba(255,255,255,0.4);
    z-index: 10;
    white-space: nowrap;
  }

  #controls {
    position: fixed;
    bottom: 36px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 12px;
    z-index: 10;
  }

  .btn {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.72rem;
    letter-spacing: 0.12em;
    padding: 10px 20px;
    border: 1px solid rgba(255,255,255,0.2);
    background: rgba(0,0,0,0.6);
    color: rgba(255,255,255,0.5);
    cursor: pointer;
    transition: all 0.2s;
    text-transform: uppercase;
    backdrop-filter: blur(8px);
  }

  .btn:hover  { border-color: rgba(255,255,255,0.6); color: #fff; }
  .btn.active { border-color: #fff; color: #fff; background: rgba(255,255,255,0.08); box-shadow: 0 0 18px rgba(255,255,255,0.15); }

  #info {
    position: fixed;
    top: 80px;
    left: 32px;
    z-index: 10;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .body-indicator {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 0.7rem;
    letter-spacing: 0.1em;
    opacity: 0.8;
  }

  .body-dot { width: 8px; height: 8px; border-radius: 50%; }

  /* ── NEW: Lagrange point labels ───────────────────────── */
  #lagrange-info {
    position: fixed;
    top: 80px;
    left: 32px;
    z-index: 10;
    display: none;           /* hidden until potential view loads */
    flex-direction: column;
    gap: 8px;
  }

  .l-label {
    font-size: 0.65rem;
    letter-spacing: 0.12em;
    opacity: 0.75;
  }
  /* ─────────────────────────────────────────────────────── */

  #loading {
    position: fixed;
    inset: 0;
    background: #000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 100;
    gap: 20px;
    transition: opacity 0.8s;
  }

  #loading h2 { font-family: 'Orbitron', sans-serif; font-size: 1.4rem; letter-spacing: 0.3em; font-weight: 400; }
  #loading-bar-wrap { width: 260px; height: 1px; background: rgba(255,255,255,0.1); }
  #loading-bar { height: 1px; background: #fff; width: 0%; transition: width 0.3s; }
  #loading-text { font-size: 0.65rem; letter-spacing: 0.2em; color: rgba(255,255,255,0.4); }

  #hint {
    position: fixed;
    bottom: 90px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 0.6rem;
    letter-spacing: 0.15em;
    color: rgba(255,255,255,0.2);
    z-index: 10;
    white-space: nowrap;
  }

  #speed-wrap {
    position: fixed;
    top: 80px;
    right: 32px;
    z-index: 10;
    display: flex;
    flex-direction: column;
    gap: 8px;
    align-items: flex-end;
  }

  #speed-label { font-size: 0.6rem; letter-spacing: 0.15em; color: rgba(255,255,255,0.35); }

  #speed-slider {
    -webkit-appearance: none;
    width: 100px;
    height: 1px;
    background: rgba(255,255,255,0.2);
    outline: none;
  }

  #speed-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 10px; height: 10px;
    border-radius: 50%;
    background: #fff;
    cursor: pointer;
  }
</style>
</head>
<body>

<div id="loading">
  <h2>THREE BODY PROBLEM</h2>
  <div id="loading-bar-wrap"><div id="loading-bar"></div></div>
  <div id="loading-text">INITIALIZING SIMULATION</div>
</div>

<div id="canvas-container"></div>

<div id="title">THREE · BODY · PROBLEM</div>

<!-- Existing body indicators -->
<div id="info">
  <div class="body-indicator"><div class="body-dot" style="background:#ff4444;box-shadow:0 0 8px #ff4444"></div>BODY 01</div>
  <div class="body-indicator"><div class="body-dot" style="background:#44ff88;box-shadow:0 0 8px #44ff88"></div>BODY 02</div>
  <div class="body-indicator"><div class="body-dot" style="background:#4488ff;box-shadow:0 0 8px #4488ff"></div>BODY 03</div>
</div>

<!-- ── NEW: Lagrange point legend ──────────────────────────── -->
<div id="lagrange-info">
  <div class="l-label" style="color:#ff4444">● SUN</div>
  <div class="l-label" style="color:#ffaa00">● JUPITER</div>
  <div class="l-label" style="color:#ffffff">✦ L1 — between Sun &amp; Jupiter</div>
  <div class="l-label" style="color:#ffffff">✦ L2 — beyond Jupiter</div>
  <div class="l-label" style="color:#ffffff">✦ L3 — opposite Jupiter</div>
  <div class="l-label" style="color:#aaffcc">✦ L4 — 60° ahead of Jupiter</div>
  <div class="l-label" style="color:#aaffcc">✦ L5 — 60° behind Jupiter</div>
</div>
<!-- ─────────────────────────────────────────────────────────── -->

<div id="speed-wrap">
  <div id="speed-label">PLAYBACK SPEED</div>
  <input type="range" id="speed-slider" min="1" max="20" value="5">
</div>

<div id="controls">
  <button class="btn active" onclick="loadScenario('figure-eight')">FIGURE EIGHT</button>
  <button class="btn" onclick="loadScenario('lagrange')">LAGRANGE</button>
  <button class="btn" onclick="loadScenario('chaotic')">CHAOTIC</button>
  <button class="btn" onclick="loadScenario('euler')">EULER</button>
  <!-- ── NEW button ── -->
  <button class="btn" onclick="loadPotential()">RESTRICTED 3-BODY</button>
</div>

<div id="hint">DRAG TO ROTATE &nbsp;·&nbsp; SCROLL TO ZOOM</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ── Scene setup ──────────────────────────────────────────────
const container = document.getElementById('canvas-container');
const renderer  = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
container.appendChild(renderer.domElement);

const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.001, 1000);
camera.position.set(0, 0, 5);

// Starfield
const starGeo = new THREE.BufferGeometry();
const starVerts = [];
for (let i = 0; i < 6000; i++) {
  starVerts.push((Math.random()-0.5)*400, (Math.random()-0.5)*400, (Math.random()-0.5)*400);
}
starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starVerts, 3));
scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.12, transparent: true, opacity: 0.5 })));

// ── Orbit controls (manual) ───────────────────────────────────
let isDragging = false, prevMouse = {x:0, y:0};
let spherical = { theta: 0, phi: Math.PI/2, r: 5 };

renderer.domElement.addEventListener('mousedown', e => { isDragging = true; prevMouse = {x:e.clientX, y:e.clientY}; });
renderer.domElement.addEventListener('mouseup',   () => isDragging = false);
renderer.domElement.addEventListener('mousemove', e => {
  if (!isDragging) return;
  const dx = e.clientX - prevMouse.x, dy = e.clientY - prevMouse.y;
  spherical.theta -= dx * 0.005;
  spherical.phi   = Math.max(0.1, Math.min(Math.PI-0.1, spherical.phi + dy*0.005));
  prevMouse = {x:e.clientX, y:e.clientY};
});
renderer.domElement.addEventListener('wheel', e => {
  spherical.r = Math.max(1, Math.min(20, spherical.r + e.deltaY * 0.005));
});
renderer.domElement.addEventListener('touchstart', e => { isDragging = true; prevMouse = {x:e.touches[0].clientX, y:e.touches[0].clientY}; });
renderer.domElement.addEventListener('touchend',   () => isDragging = false);
renderer.domElement.addEventListener('touchmove',  e => {
  const dx = e.touches[0].clientX - prevMouse.x, dy = e.touches[0].clientY - prevMouse.y;
  spherical.theta -= dx * 0.005;
  spherical.phi   = Math.max(0.1, Math.min(Math.PI-0.1, spherical.phi + dy*0.005));
  prevMouse = {x:e.touches[0].clientX, y:e.touches[0].clientY};
});

function updateCamera() {
  camera.position.set(
    spherical.r * Math.sin(spherical.phi) * Math.sin(spherical.theta),
    spherical.r * Math.cos(spherical.phi),
    spherical.r * Math.sin(spherical.phi) * Math.cos(spherical.theta)
  );
  camera.lookAt(0, 0, 0);
}

// ── Body colors & materials ───────────────────────────────────
const COLORS = [0xff4444, 0x44ff88, 0x4488ff];
const TRAIL_LENGTH = 300;

let bodies3D = [];
let trailData = [[], [], []];
let frameIndex = 0;
let allFrames  = [];
let animRunning = false;
let speedSlider = document.getElementById('speed-slider');

function buildBodies() {
  bodies3D.forEach(b => { scene.remove(b.mesh); scene.remove(b.trail); scene.remove(b.glow); });
  bodies3D = [];

  COLORS.forEach((col, i) => {
    const geo  = new THREE.SphereGeometry(0.04, 16, 16);
    const mat  = new THREE.MeshBasicMaterial({ color: col });
    const mesh = new THREE.Mesh(geo, mat);
    scene.add(mesh);

    const canvas = document.createElement('canvas');
    canvas.width = canvas.height = 64;
    const ctx = canvas.getContext('2d');
    const grad = ctx.createRadialGradient(32,32,2,32,32,32);
    const hex = '#' + col.toString(16).padStart(6,'0');
    grad.addColorStop(0,   hex);
    grad.addColorStop(0.3, hex + 'aa');
    grad.addColorStop(1,   'transparent');
    ctx.fillStyle = grad;
    ctx.fillRect(0,0,64,64);
    const tex    = new THREE.CanvasTexture(canvas);
    const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, opacity: 0.9, depthWrite: false }));
    sprite.scale.set(0.35, 0.35, 1);
    scene.add(sprite);

    const positions = new Float32Array(TRAIL_LENGTH * 3);
    const trailGeo  = new THREE.BufferGeometry();
    trailGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    trailGeo.setDrawRange(0, 0);
    const trailMat  = new THREE.LineBasicMaterial({ color: col, transparent: true, opacity: 0.35, linewidth: 1 });
    const trail     = new THREE.Line(trailGeo, trailMat);
    scene.add(trail);

    bodies3D.push({ mesh, glow: sprite, trail, trailPositions: positions, trailCount: 0 });
  });

  trailData = [[], [], []];
}

// ── Parse CSV ─────────────────────────────────────────────────
function parseCSV(text) {
  const lines  = text.trim().split('\n');
  const frames = [];
  for (let i = 1; i < lines.length; i++) {
    const v = lines[i].split(',').map(Number);
    if (v.length < 9) continue;
    frames.push([
      [v[0], v[1], v[2]],
      [v[3], v[4], v[5]],
      [v[6], v[7], v[8]]
    ]);
  }
  return frames;
}

function normalizeFrames(frames) {
  let maxR = 0;
  frames.forEach(f => f.forEach(p => {
    const r = Math.sqrt(p[0]*p[0]+p[1]*p[1]+p[2]*p[2]);
    if (r > maxR) maxR = r;
  }));
  const scale = maxR > 0 ? 1.8 / maxR : 1;
  return frames.map(f => f.map(p => [p[0]*scale, p[1]*scale, p[2]*scale]));
}

// ── Load scenario ─────────────────────────────────────────────
async function loadScenario(name) {
  document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');

  // ── NEW: hide potential view, show body indicators ──
  clearPotentialScene();
  document.getElementById('info').style.display          = 'flex';
  document.getElementById('lagrange-info').style.display = 'none';
  // ───────────────────────────────────────────────────

  animRunning = false;
  setLoadingText('LOADING ' + name.toUpperCase());
  setLoadingBar(10);

  try {
    const res  = await fetch(name + '.csv');
    setLoadingBar(50);
    const text = await res.text();
    setLoadingBar(80);
    allFrames  = normalizeFrames(parseCSV(text));
    frameIndex = 0;
    buildBodies();
    setLoadingBar(100);
    setTimeout(() => { animRunning = true; }, 200);
  } catch(e) {
    setLoadingText('ERROR: PLACE CSV FILES IN SAME FOLDER AS THIS HTML');
    console.error(e);
  }
}

function setLoadingBar(pct) { document.getElementById('loading-bar').style.width = pct + '%'; }
function setLoadingText(t)  { document.getElementById('loading-text').textContent = t; }


// ── NEW: Potential surface ────────────────────────────────────

// Objects we need to remove when switching away
let potentialObjects = [];

function clearPotentialScene() {
  potentialObjects.forEach(obj => scene.remove(obj));
  potentialObjects = [];
}

async function loadPotential() {
  // Button state
  document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');

  // Stop body animation, hide bodies, show lagrange legend
  animRunning = false;
  clearPotentialScene();
  buildBodies();                                              // clears old body meshes
  bodies3D.forEach(b => {
    b.mesh.visible = false;
    b.glow.visible = false;
    b.trail.visible = false;
  });
  document.getElementById('info').style.display          = 'none';
  document.getElementById('lagrange-info').style.display = 'flex';

  setLoadingText('LOADING POTENTIAL SURFACE');
  setLoadingBar(10);

  try {
    const res  = await fetch('potential.csv');
    setLoadingBar(40);
    const text = await res.text();
    setLoadingBar(70);
    buildPotentialSurface(text);
    setLoadingBar(100);

    // Tilt camera to a nice angle for the 3D surface
    spherical.phi   = Math.PI / 3.5;
    spherical.theta = 0.4;
    spherical.r     = 6;

  } catch(e) {
    setLoadingText('ERROR: PLACE potential.csv IN SAME FOLDER AS THIS HTML');
    console.error(e);
  }
}

function buildPotentialSurface(csvText) {
  // ── 1. Parse the CSV into a flat array of {x, y, phi} ──
  const lines = csvText.trim().split('\n');
  const N = 300;   // must match what C++ wrote

  // Read all values, find min/max for color mapping
  const vals = [];
  for (let i = 1; i < lines.length; i++) {
    const [x, y, phi] = lines[i].split(',').map(Number);
    vals.push({ x, y, phi });
  }

  const phiMin = Math.min(...vals.map(v => v.phi));
  const phiMax = Math.max(...vals.map(v => v.phi));

  // ── 2. Build a PlaneGeometry — a flat N×N grid ──
  // PlaneGeometry(width, height, widthSegments, heightSegments)
  // widthSegments = N-1 means N vertices along each axis
  const geo = new THREE.PlaneGeometry(4, 4, N - 1, N - 1);

  // PlaneGeometry lies in the XY plane by default.
  // Its vertices are stored row by row in position array.
  // We'll use Z as the "height" = potential value.
  const pos    = geo.attributes.position;        // x,y,z for every vertex
  const colors = new Float32Array(pos.count * 3); // RGB for every vertex

  for (let i = 0; i < pos.count; i++) {
    const phi = vals[i] ? vals[i].phi : 0;

    // Height: scale potential into a visible range
    const t = (phi - phiMin) / (phiMax - phiMin);   // 0 = lowest, 1 = highest
    pos.setZ(i, (t - 0.5) * 1.2);                   // centered, ±0.6 units tall

    // Color: deep blue (low) → purple → hot pink → white (high)
    const r = Math.min(1, t * 2.5);
    const g = Math.max(0, t - 0.5) * 0.6;
    const b = Math.min(1, 1.2 - t * 1.5);
    colors[i*3]   = r;
    colors[i*3+1] = g;
    colors[i*3+2] = b;
  }

  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  geo.computeVertexNormals();   // needed for lighting to work correctly

  // ── 3. Material: wireframe overlay + solid surface ──
  const solidMat = new THREE.MeshPhongMaterial({
    vertexColors: true,
    side: THREE.DoubleSide,
    shininess: 60,
    transparent: true,
    opacity: 0.85,
  });

  const wireMat = new THREE.MeshBasicMaterial({
    color: 0xffffff,
    wireframe: true,
    transparent: true,
    opacity: 0.06,
  });

  const solidMesh = new THREE.Mesh(geo, solidMat);
  const wireMesh  = new THREE.Mesh(geo, wireMat);

  scene.add(solidMesh);
  scene.add(wireMesh);
  potentialObjects.push(solidMesh, wireMesh);

  // ── 4. Lighting for the surface ──
  const ambient = new THREE.AmbientLight(0xffffff, 0.4);
  const point1  = new THREE.PointLight(0xffffff, 1.2, 20);
  point1.position.set(2, 3, 2);
  const point2  = new THREE.PointLight(0x8844ff, 0.8, 20);
  point2.position.set(-2, -1, 2);

  scene.add(ambient, point1, point2);
  potentialObjects.push(ambient, point1, point2);

  // ── 5. Mark the 5 Lagrange points ──
  // These are the known positions in the co-rotating frame
  // mu ≈ 0.001 (Jupiter/total mass), so positions are nearly textbook values
  const mu = 0.001;

  // L1, L2, L3 lie on the x-axis; L4, L5 form equilateral triangles
  const lagrangePoints = [
    { name: 'L1', x:  (1 - Math.cbrt(mu/3)),          y: 0,           color: 0xffffff },
    { name: 'L2', x:  (1 + Math.cbrt(mu/3)),          y: 0,           color: 0xffffff },
    { name: 'L3', x: -(1 + 5*mu/12),                  y: 0,           color: 0xffffff },
    { name: 'L4', x:  0.5 - mu,                        y:  Math.sqrt(3)/2, color: 0xaaffcc },
    { name: 'L5', x:  0.5 - mu,                        y: -Math.sqrt(3)/2, color: 0xaaffcc },
  ];

  // Helper: make a canvas text label sprite
  function makeLabel(text, color) {
    const c = document.createElement('canvas');
    c.width = 256; c.height = 64;
    const ctx = c.getContext('2d');
    ctx.clearRect(0, 0, 256, 64);
    ctx.font = 'bold 28px "Share Tech Mono", monospace';
    ctx.fillStyle = color;
    ctx.fillText(text, 8, 40);
    const tex = new THREE.CanvasTexture(c);
    const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false });
    const sprite = new THREE.Sprite(mat);
    sprite.scale.set(0.8, 0.2, 1);
    return sprite;
  }

  // Sun and Jupiter — their coords are in [-1,1], plane is [-2,2] so multiply by 2
 const bodyMarkers = [
    { name: 'SUN',     x: -mu,       y: 0, color: '#ff4444', size: 0.12, z: 0.8  },
    { name: 'JUPITER', x: 1 - mu,    y: 0, color: '#ffaa00', size: 0.06, z: 0.3  },
  ];
  bodyMarkers.forEach(b => {
    const bMesh = new THREE.Mesh(
      new THREE.SphereGeometry(b.size, 16, 16),
      new THREE.MeshBasicMaterial({ color: b.color })
    );
    bMesh.position.set(b.x * 2, b.y * 2, b.z);
    scene.add(bMesh);
    potentialObjects.push(bMesh);

    const label = makeLabel(b.name, b.color);
    label.position.set(b.x * 2, b.y * 2 + 0.22, b.z + 0.22);
    scene.add(label);
    potentialObjects.push(label);
  });

  // Lagrange points
  lagrangePoints.forEach(lp => {
    const height = getPotentialHeight(lp.x, lp.y, vals, phiMin, phiMax);

    // Marker sphere
    const marker = new THREE.Mesh(
      new THREE.SphereGeometry(0.032, 12, 12),
      new THREE.MeshBasicMaterial({ color: lp.color })
    );
    marker.position.set(lp.x * 2, lp.y * 2, height + 0.05);
    scene.add(marker);
    potentialObjects.push(marker);

    // Glow
    const gc   = document.createElement('canvas');
    gc.width   = gc.height = 64;
    const gctx = gc.getContext('2d');
    const grad = gctx.createRadialGradient(32,32,2,32,32,32);
    const hex  = '#' + lp.color.toString(16).padStart(6,'0');
    grad.addColorStop(0,   hex);
    grad.addColorStop(0.4, hex + '88');
    grad.addColorStop(1,   'transparent');
    gctx.fillStyle = grad;
    gctx.fillRect(0,0,64,64);
    const glow = new THREE.Sprite(new THREE.SpriteMaterial({
      map: new THREE.CanvasTexture(gc),
      transparent: true, opacity: 0.85, depthWrite: false
    }));
    glow.scale.set(0.25, 0.25, 1);
    glow.position.copy(marker.position);
    scene.add(glow);
    potentialObjects.push(glow);

    // Text label
    const label = makeLabel(lp.name, '#' + lp.color.toString(16).padStart(6,'0'));
    label.position.set(lp.x * 2, lp.y * 2 + 0.18, height + 0.15);
    scene.add(label);
    potentialObjects.push(label);
  });
// Helper: given a world (x,y) in [-1,1] range, find the surface height
function getPotentialHeight(x, y, vals, phiMin, phiMax) {
  // Our grid goes from -2 to 2 in C++, so world coords are already in that range
  // Map to grid index
  const N     = 300;
  const range = 2.0;
  const i = Math.round((x + range) / (2 * range) * (N - 1));
  const j = Math.round((y + range) / (2 * range) * (N - 1));
  const idx = Math.min(Math.max(i * N + j, 0), vals.length - 1);
  const phi = vals[idx] ? vals[idx].phi : 0;
  const t   = (phi - phiMin) / (phiMax - phiMin);
  return (t - 0.5) * 1.2;
}

// ─────────────────────────────────────────────────────────────


// ── Animation loop ────────────────────────────────────────────
function animate() {
  requestAnimationFrame(animate);
  updateCamera();

  if (animRunning && allFrames.length > 0) {
    const speed = parseInt(speedSlider.value);

    for (let s = 0; s < speed; s++) {
      const frame = allFrames[frameIndex % allFrames.length];
      frameIndex++;

      frame.forEach((pos, i) => {
        const b = bodies3D[i];
        b.mesh.position.set(pos[0], pos[1], pos[2]);
        b.glow.position.set(pos[0], pos[1], pos[2]);

        trailData[i].push([...pos]);
        if (trailData[i].length > TRAIL_LENGTH) trailData[i].shift();

        const pts = b.trailPositions;
        const len = trailData[i].length;
        for (let t = 0; t < len; t++) {
          pts[t*3]   = trailData[i][t][0];
          pts[t*3+1] = trailData[i][t][1];
          pts[t*3+2] = trailData[i][t][2];
        }
        b.trail.geometry.attributes.position.needsUpdate = true;
        b.trail.geometry.setDrawRange(0, len);
      });
    }
  }

  renderer.render(scene, camera);
}

// ── Resize ────────────────────────────────────────────────────
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ── Boot ──────────────────────────────────────────────────────
buildBodies();
animate();

(async () => {
  setLoadingText('LOADING FIGURE-EIGHT');
  setLoadingBar(10);
  try {
    const res  = await fetch('figure-eight.csv');
    setLoadingBar(50);
    const text = await res.text();
    setLoadingBar(80);
    allFrames  = normalizeFrames(parseCSV(text));
    buildBodies();
    setLoadingBar(100);
    setTimeout(() => {
      document.getElementById('loading').style.opacity = '0';
      setTimeout(() => document.getElementById('loading').style.display = 'none', 800);
      animRunning = true;
    }, 400);
  } catch(e) {
    setLoadingText('⚠ PLACE ALL CSV FILES IN THE SAME FOLDER AS THIS HTML FILE');
  }
})();
</script>
</body>
</html>
